name: Are You Still Watching development checks

on:
  push:
    branches:
      - feature/are-you-still-watching
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Run unit tests and build development APK
        run: ./gradlew --no-configuration-cache testDebugUnitTest assembleDebug
