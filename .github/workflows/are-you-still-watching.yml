name: Are You Still Watching development checks

on:
  push:
    branches:
      - feature/are-you-still-watching
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # GitHub-hosted Ubuntu runners already provide the Android command-line tools.
      # setup-android currently tries to install the retired 'tools' SDK package and fails.
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Run unit tests and build development APK
        run: ./gradlew --no-configuration-cache testDebugUnitTest assembleDebug
